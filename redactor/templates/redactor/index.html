{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PII Redaction Tool</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        .hidden { display: none; }

        .loading {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            background: #eff6ff;
            color: #1e3a8a;
        }

        .spinner {
            width: 26px;
            height: 26px;
            margin: 0 auto 10px;
            border: 4px solid #bfdbfe;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        input[type=file] {
            margin: 20px 0;
            width: 100%;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover { background: #1d4ed8; }

        .error-box {
            background: #fef2f2;
            color: #991b1b;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 16px;
            font-size: 0.85rem;
            text-align: left;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>PII Redaction Tool</h2>

    {% if error %}
    <div class="error-box">
        &#9888;&#65039; {{ error|safe }}
    </div>
    {% endif %}

    <form id="redaction-form" method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <input type="file" name="document" accept=".docx" required>

        <br>

        <button type="submit" id="submit-btn">Redact Document</button>
    </form>

    <div id="loading" class="loading hidden" aria-live="polite">
        <div class="spinner"></div>
        <strong>Redacting your document&hellip;</strong>
        <p id="estimate">Estimated time: about 15 seconds</p>
        <small>Please keep this page open while processing finishes.</small>
    </div>
</div>

<script src="{% static 'redactor/js/upload.js' %}"></script>

</body>
</html>
